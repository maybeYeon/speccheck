name: 공공기관 채용공고 자동 갱신

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 공고 수집
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python3 scripts/fetch_public_jobs.py

      - name: 변경 시 커밋·배포
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jobs-live.json
          git diff --cached --quiet || git commit -m "공공기관 채용공고 자동 갱신"
          git push
